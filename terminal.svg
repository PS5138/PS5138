<svg viewBox="0 0 840 470" width="840" height="470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animation: doctor turned AI safety engineer">
  <defs>
    <clipPath id="type1"><rect x="34" y="86" width="0" height="24">
      <animate attributeName="width" from="0" to="90" dur="0.7s" begin="0.6s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="34" y="166" width="0" height="24">
      <animate attributeName="width" from="0" to="255" dur="1.2s" begin="2.4s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="34" y="246" width="0" height="24">
      <animate attributeName="width" from="0" to="210" dur="1.1s" begin="4.6s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="34" y="350" width="0" height="24">
      <animate attributeName="width" from="0" to="140" dur="0.8s" begin="7.4s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="839" height="469" rx="12" fill="#0D1117" stroke="#30363D"/>
  <rect x="0.5" y="0.5" width="839" height="40" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="0.5" y="28" width="839" height="13" fill="#161B22"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="20" r="6" fill="#27C93F"/>
  <text x="420" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B949E">parivrudh@clinic:~</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">

    <!-- 1: whoami -->
    <text x="34" y="103" fill="#D29922">$</text>
    <text x="52" y="103" fill="#E6EDF3" clip-path="url(#type1)">whoami</text>
    <text x="34" y="131" fill="#8B949E" opacity="0">doctor&#8201;&#8594;&#8201;data scientist&#8201;&#8594;&#8201;AI safety
      <set attributeName="opacity" to="1" begin="1.6s"/>
    </text>

    <!-- 2: deploy -->
    <text x="34" y="183" fill="#D29922" opacity="0">$<set attributeName="opacity" to="1" begin="2.3s"/></text>
    <text x="52" y="183" fill="#E6EDF3" clip-path="url(#type2)">./deploy --ai --nhs</text>
    <text x="34" y="211" fill="#3FB950" opacity="0">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9617;&#9617;  scaling across thousands of users
      <set attributeName="opacity" to="1" begin="3.9s"/>
    </text>

    <!-- 3: ai safety -->
    <text x="34" y="263" fill="#D29922" opacity="0">$<set attributeName="opacity" to="1" begin="4.5s"/></text>
    <text x="52" y="263" fill="#E6EDF3" clip-path="url(#type3)">./run --ai-safety</text>
    <text x="34" y="291" fill="#8B949E" opacity="0">debate&#8201;&#8201;: AIs arguing with each other for a better diagnosis <tspan fill="#3FB950">&#10003;</tspan>
      <set attributeName="opacity" to="1" begin="6.2s"/>
    </text>
    <text x="34" y="315" fill="#8B949E" opacity="0">welfare : making models speak their internal thoughts <tspan fill="#3FB950">&#10003;</tspan>
      <set attributeName="opacity" to="1" begin="6.8s"/>
    </text>

    <!-- 4: mission -->
    <text x="34" y="367" fill="#D29922" opacity="0">$<set attributeName="opacity" to="1" begin="7.3s"/></text>
    <text x="52" y="367" fill="#E6EDF3" clip-path="url(#type4)">cat mission.txt</text>
    <text x="34" y="395" fill="#E6EDF3" opacity="0">AI you could trust with a patient.
      <set attributeName="opacity" to="1" begin="8.5s"/>
    </text>

    <!-- prompt + blinking cursor -->
    <text x="34" y="431" fill="#D29922" opacity="0">$<set attributeName="opacity" to="1" begin="9s"/></text>
    <rect x="52" y="418" width="9" height="17" fill="#E6EDF3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ECG trace -->
  <path d="M560 424 h60 l7,-11 7,22 8,-30 5,19 h30 l7,-11 7,22 8,-30 5,19 h60"
        fill="none" stroke="#3FB950" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="330" stroke-dashoffset="330" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1.6s" begin="9.4s" fill="freeze"/>
  </path>
  <circle cx="824" cy="424" r="3" fill="#3FB950" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="11s" repeatCount="indefinite"/>
  </circle>
</svg>
